<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>cos 安排板</title>
<style>
  :root{
    --bg:#faf6f8; --surface:#ffffff; --surface-2:#f5eef2; --surface-3:#efe6ec;
    --border:#ece1e8; --border-strong:#e0d2db;
    --text:#2b2029; --text-dim:#8b7b86; --text-faint:#b3a5ae;
    --primary:#d6336c; --primary-ink:#b71e57; --primary-soft:#fde7ef;
    --accent:#7048e8; --accent-soft:#efe9fd;
    --success:#2f9e44; --success-soft:#e7f6ea;
    --warn:#e8590c; --warn-soft:#ffe8d6;
    --danger:#e03131;
    --shadow-sm:0 1px 2px rgba(45,20,40,.06);
    --shadow:0 1px 3px rgba(45,20,40,.06), 0 10px 30px rgba(45,20,40,.06);
    --shadow-lg:0 8px 40px rgba(45,20,40,.18);
    --radius:16px; --radius-sm:11px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#161219; --surface:#211a26; --surface-2:#2a2130; --surface-3:#332839;
      --border:#352b3d; --border-strong:#41354b;
      --text:#f3ebf1; --text-dim:#ab9bb0; --text-faint:#7c6d82;
      --primary:#f06595; --primary-ink:#f783ac; --primary-soft:#3a2130;
      --accent:#9775fa; --accent-soft:#2c2440;
      --success:#69db7c; --success-soft:#1f3324; --warn:#ffa94d; --warn-soft:#3a2917;
      --danger:#ff6b6b;
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      --shadow:0 1px 3px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
      --shadow-lg:0 8px 40px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"]{
    --bg:#161219; --surface:#211a26; --surface-2:#2a2130; --surface-3:#332839;
    --border:#352b3d; --border-strong:#41354b;
    --text:#f3ebf1; --text-dim:#ab9bb0; --text-faint:#7c6d82;
    --primary:#f06595; --primary-ink:#f783ac; --primary-soft:#3a2130;
    --accent:#9775fa; --accent-soft:#2c2440;
    --success:#69db7c; --success-soft:#1f3324; --warn:#ffa94d; --warn-soft:#3a2917;
    --danger:#ff6b6b;
    --shadow-sm:0 1px 2px rgba(0,0,0,.3);
    --shadow:0 1px 3px rgba(0,0,0,.3), 0 10px 30px rgba(0,0,0,.35);
    --shadow-lg:0 8px 40px rgba(0,0,0,.55);
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    line-height:1.55; -webkit-font-smoothing:antialiased;
    padding:0 0 env(safe-area-inset-bottom);
  }
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:15px}

  .wrap{max-width:960px;margin:0 auto;padding:0 16px}

  /* Header */
  header.top{
    position:sticky;top:0;z-index:30;background:var(--bg);
    border-bottom:1px solid var(--border);
    background:linear-gradient(var(--bg),var(--bg)) padding-box;
  }
  .top-bar{height:4px;background:linear-gradient(90deg,var(--primary),var(--accent))}
  .top-inner{display:flex;align-items:center;gap:12px;padding:14px 16px 12px;max-width:960px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:11px;min-width:0}
  .logo{
    width:38px;height:38px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,var(--primary),var(--accent));
    display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-sm)
  }
  .logo svg{width:21px;height:21px}
  .title-h1{font-size:18px;font-weight:750;letter-spacing:-.02em;margin:0;white-space:nowrap}
  .title-sub{font-size:12px;color:var(--text-dim);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1 1 auto;min-width:8px}
  .contrib{display:flex;align-items:center;gap:8px}
  .avatars{display:flex}
  .avatars img{
    width:28px;height:28px;border-radius:50%;border:2px solid var(--bg);
    margin-left:-8px;object-fit:cover;background:var(--surface-3)
  }
  .avatars img:first-child{margin-left:0}
  .contrib-label{font-size:12px;color:var(--text-dim);white-space:nowrap}
  @media (max-width:560px){.contrib-label{display:none}}

  /* Tabs */
  nav.tabs{display:flex;gap:4px;padding:0 8px;max-width:960px;margin:0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
  nav.tabs::-webkit-scrollbar{display:none}
  .tab{
    appearance:none;background:none;border:none;color:var(--text-dim);
    padding:11px 12px 12px;font-size:14.5px;font-weight:600;position:relative;
    white-space:nowrap;display:flex;align-items:center;gap:7px;border-radius:8px 8px 0 0;
  }
  .tab .cnt{
    font-size:11.5px;font-weight:700;background:var(--surface-3);color:var(--text-dim);
    padding:1px 7px;border-radius:20px;min-width:20px;text-align:center
  }
  .tab.active{color:var(--text)}
  .tab.active .cnt{background:var(--primary-soft);color:var(--primary-ink)}
  .tab.active::after{
    content:"";position:absolute;left:8px;right:8px;bottom:0;height:3px;border-radius:3px 3px 0 0;
    background:linear-gradient(90deg,var(--primary),var(--accent))
  }

  main{padding:20px 0 60px}
  .section-head{display:flex;align-items:center;gap:12px;margin:2px 4px 16px}
  .section-head h2{font-size:20px;font-weight:750;letter-spacing:-.02em;margin:0}  .section-head p{font-size:13px;color:var(--text-dim);margin:2px 0 0}

  .btn{
    appearance:none;border:1px solid var(--border-strong);background:var(--surface);
    color:var(--text);padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:.12s;box-shadow:var(--shadow-sm)
  }
  .btn:hover{border-color:var(--primary);color:var(--primary)}
  .btn svg{width:16px;height:16px}
  .btn.primary{
    background:linear-gradient(135deg,var(--primary),var(--accent));color:#fff;border:none;
    box-shadow:0 2px 10px rgba(214,51,108,.3)
  }
  .btn.primary:hover{color:#fff;filter:brightness(1.05)}
  .btn.sm{padding:6px 10px;font-size:13px}
  .btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-dim)}
  .btn.ghost:hover{background:var(--surface-2);color:var(--text)}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}

  /* Cards grid */
  .grid{display:grid;gap:14px}
  .grid.chars{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  @media (max-width:520px){.grid.chars{grid-template-columns:1fr}}

  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;position:relative;transition:.15s
  }
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}

  /* Character card */
  .char-imgs{display:flex;gap:0;height:172px;background:var(--surface-2);position:relative}
  .char-imgs .ph{flex:1;display:grid;place-items:center;color:var(--text-faint)}
  .char-imgs .ph svg{width:40px;height:40px;opacity:.5}
  .char-imgs img{flex:1;min-width:0;object-fit:cover;height:100%;cursor:zoom-in}
  .char-imgs .more{
    position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;
    font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;backdrop-filter:blur(4px)
  }
  .char-body{padding:13px 14px 15px}
  .photo-head{display:flex;align-items:center;gap:11px;margin-bottom:11px}
  .char-name{font-size:16.5px;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
  .chip{
    font-size:11.5px;font-weight:650;padding:2px 8px;border-radius:20px;
    background:var(--accent-soft);color:var(--accent);white-space:nowrap
  }
  .char-series{font-size:13px;color:var(--text-dim);margin-top:1px}
  .char-notes{font-size:13.5px;color:var(--text);margin-top:9px;white-space:pre-wrap;word-break:break-word}
  .kv{margin-top:9px;font-size:13px;display:flex;gap:6px}
  .kv .k{color:var(--text-faint);flex:none;font-weight:600}
  .kv .v{color:var(--text);white-space:pre-wrap;word-break:break-word}
  .status-row{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .stat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:650;padding:3px 9px 3px 8px;border-radius:20px;line-height:1.4}
  .stat::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none;opacity:.9}
  .stat .stat-k{opacity:.65;font-weight:600}
  .stat.todo{background:var(--surface-3);color:var(--text-dim)}
  .stat.doing{background:var(--warn-soft);color:var(--warn)}
  .stat.done{background:var(--success-soft);color:var(--success)}
  .stat.click{cursor:pointer;user-select:none;transition:box-shadow .12s,opacity .12s}
  .stat.click:hover{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px currentColor}
  .stat.click:active{transform:scale(.96)}
  .stat.unset{background:transparent;border:1px dashed var(--border-strong);color:var(--text-faint);padding-top:2px;padding-bottom:2px}
  .stat.unset::before{opacity:.35}
  .card-foot{
    display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:11px;
    border-top:1px solid var(--border);font-size:12px;color:var(--text-faint)
  }
  .card-foot img{width:18px;height:18px;border-radius:50%;object-fit:cover}
  .card-foot .grow{flex:1}
  .icon-btn{
    appearance:none;border:none;background:none;color:var(--text-faint);
    width:28px;height:28px;border-radius:8px;display:grid;place-items:center;transition:.12s
  }
  .icon-btn:hover{background:var(--surface-2);color:var(--text)}
  .icon-btn svg{width:16px;height:16px}

  /* Location list */
  .list{display:flex;flex-direction:column;gap:10px}
  .loc{display:flex;gap:13px;padding:15px;align-items:flex-start}
  .loc .pin{
    width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--primary-soft);color:var(--primary)
  }
  .loc .pin svg{width:20px;height:20px}
  .loc .info{flex:1;min-width:0}
  .loc .info h3{margin:0;font-size:16px;font-weight:700}
  .loc .addr{font-size:13px;color:var(--text-dim);margin-top:1px}
  .loc .note{font-size:13.5px;color:var(--text);margin-top:6px;white-space:pre-wrap;word-break:break-word}

  /* Schedule */
  .day-group{margin-bottom:20px}
  .day-label{
    font-size:13px;font-weight:750;color:var(--primary-ink);margin:0 4px 9px;
    display:flex;align-items:center;gap:8px
  }
  .day-label .dot{width:7px;height:7px;border-radius:50%;background:var(--primary)}
  .day-label .weekday{color:var(--text-dim);font-weight:600}
  .sch{display:flex;gap:14px;padding:14px 15px;align-items:flex-start}
  .sch .time{
    flex:none;width:58px;text-align:right;font-variant-numeric:tabular-nums;
    font-weight:700;font-size:15px;color:var(--text);padding-top:1px
  }
  .sch .time .tbd{font-size:12px;color:var(--text-faint);font-weight:600}
  .sch .rail{flex:none;width:2px;align-self:stretch;background:var(--border);margin-top:4px;border-radius:2px;position:relative}
  .sch .rail::before{content:"";position:absolute;top:2px;left:-3px;width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .sch .body{flex:1;min-width:0}
  .sch .body h3{margin:0;font-size:15.5px;font-weight:700}
  .sch .meta{font-size:13px;color:var(--text-dim);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 12px}
  .sch .meta span{display:inline-flex;align-items:center;gap:5px}
  .sch .meta svg{width:14px;height:14px;opacity:.7}
  .sch .snote{font-size:13.5px;color:var(--text);margin-top:6px;white-space:pre-wrap;word-break:break-word}

  /* Calendar */
  .seg{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:2px}
  .seg-btn{appearance:none;border:none;background:none;color:var(--text-dim);font-weight:650;font-size:13px;padding:5px 11px;border-radius:7px;cursor:pointer;transition:.12s}
  .seg-btn.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow-sm)}
  .cal-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:12px}
  .cal-nav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .cal-title{font-size:16px;font-weight:750;flex:1;text-align:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cal-wd{text-align:center;font-size:11.5px;font-weight:700;color:var(--text-dim);padding:2px 0 6px}
  .cal-wd.we{color:var(--primary)}
  .cal-cell{min-height:76px;border-radius:9px;background:var(--surface-2);padding:4px 3px 5px;cursor:pointer;transition:.1s;overflow:hidden;display:flex;flex-direction:column;gap:3px}
  .cal-cell:hover{background:var(--surface-3)}
  .cal-cell.empty{background:transparent;cursor:default}
  .cal-cell.today{outline:2px solid var(--primary);background:var(--primary-soft)}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--text-dim);text-align:right;padding:0 2px;flex:none}
  .cal-cell.today .cal-daynum{color:var(--primary-ink)}
  .cal-evs{display:flex;flex-direction:column;gap:2px;min-width:0}
  .cev{font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 4px;white-space:nowrap;overflow:hidden;display:flex;align-items:center;gap:3px;cursor:pointer;line-height:1.45}
  .cev-t{font-weight:700;opacity:.85;flex:none}
  .cev-x{overflow:hidden;text-overflow:ellipsis}
  .cev.sch{background:var(--primary);color:#fff}
  .cev.todo{background:var(--accent-soft);color:var(--accent)}
  .cev.todo.over{background:var(--primary-soft);color:var(--primary-ink)}
  .cev.todo.done{background:var(--surface-3);color:var(--text-faint);text-decoration:line-through}
  .cev-i{display:flex;flex:none}
  .cev-i svg{width:9px;height:9px}
  .cev.more{background:none;color:var(--text-dim);font-weight:700;padding:0 4px}
  .cal-legend{display:flex;gap:16px;margin-top:10px;font-size:12px;color:var(--text-dim);justify-content:center}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  .lg-dot{width:10px;height:10px;border-radius:3px}
  .lg-dot.sch{background:var(--primary)}
  .lg-dot.todo{background:var(--accent)}
  @media (max-width:420px){ .cal-cell{min-height:62px} .cev{font-size:9.5px;padding:1px 3px} }
  .day-item{display:flex;gap:11px;padding:11px;border-radius:11px;background:var(--surface-2);margin-bottom:8px;cursor:pointer;align-items:flex-start}
  .day-item:hover{background:var(--surface-3)}
  .di-time{flex:none;font-weight:700;font-size:14px;color:var(--primary);min-width:44px}
  .di-time.flag{color:var(--accent);min-width:0}
  .di-time.flag svg{width:17px;height:17px}
  .di-body{min-width:0;flex:1}
  .di-title{font-weight:650;font-size:15px}
  .di-title.done{text-decoration:line-through;color:var(--text-faint)}
  .di-sub{font-size:12.5px;color:var(--text-dim);margin-top:1px}

  /* Todos */
  .todo{display:flex;gap:12px;padding:13px 15px;align-items:flex-start}
  .check{
    appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--border-strong);
    border-radius:7px;margin-top:1px;transition:.12s;position:relative;background:var(--surface)
  }
  .check:hover{border-color:var(--primary)}
  .check:checked{background:var(--primary);border-color:var(--primary)}
  .check:checked::after{
    content:"";position:absolute;left:6px;top:2px;width:6px;height:11px;
    border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)
  }
  .todo .tbody{flex:1;min-width:0}
  .todo .ttext{font-size:15px;font-weight:550;word-break:break-word}
  .todo.done .ttext{text-decoration:line-through;color:var(--text-faint)}
  .todo .tmeta{display:flex;flex-wrap:wrap;gap:6px 8px;margin-top:6px;align-items:center}
  .tag{
    font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:20px;
    display:inline-flex;align-items:center;gap:5px
  }
  .tag.char{background:var(--accent-soft);color:var(--accent)}
  .tag.who{background:var(--surface-3);color:var(--text-dim)}
  .tag svg{width:12px;height:12px}

  /* Empty state */
  .empty{
    text-align:center;padding:60px 24px;color:var(--text-dim);
    border:1.5px dashed var(--border-strong);border-radius:var(--radius);background:var(--surface)
  }
  .empty .ico{width:52px;height:52px;margin:0 auto 14px;color:var(--text-faint)}
  .empty .ico svg{width:100%;height:100%}
  .empty h3{margin:0 0 4px;color:var(--text);font-size:16px;font-weight:700}
  .empty p{margin:0 0 18px;font-size:14px}

  /* Banner */
  .banner{
    display:flex;align-items:center;gap:10px;padding:11px 15px;border-radius:12px;
    font-size:13.5px;margin-bottom:16px;border:1px solid var(--border)
  }
  .banner svg{width:18px;height:18px;flex:none}
  .banner.info{background:var(--accent-soft);color:var(--accent);border-color:transparent}
  .banner.read{background:var(--surface-2);color:var(--text-dim)}

  /* Modal */
  .overlay{
    position:fixed;inset:0;background:rgba(30,15,28,.5);z-index:100;
    display:flex;align-items:flex-end;justify-content:center;padding:0;
    opacity:0;pointer-events:none;transition:opacity .18s;backdrop-filter:blur(2px)
  }
  .overlay.open{opacity:1;pointer-events:auto}
  @media (min-width:600px){.overlay{align-items:center;padding:24px}}
  .modal{
    background:var(--surface);width:100%;max-width:540px;max-height:92vh;overflow-y:auto;
    border-radius:20px 20px 0 0;box-shadow:var(--shadow-lg);
    transform:translateY(20px);transition:transform .22s cubic-bezier(.2,.8,.2,1)
  }
  @media (min-width:600px){.modal{border-radius:20px}}
  .overlay.open .modal{transform:none}
  .modal-head{
    display:flex;align-items:center;gap:10px;padding:18px 20px 12px;position:sticky;top:0;
    background:var(--surface);z-index:2
  }
  .modal-head h2{font-size:18px;font-weight:750;margin:0;flex:1}
  .modal-body{padding:4px 20px 20px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:13px;font-weight:650;margin-bottom:6px;color:var(--text-dim)}
  .field label .req{color:var(--primary)}
  .field input[type=text],.field input[type=date],.field input[type=time],.field textarea,.field select{
    width:100%;padding:10px 12px;border:1.5px solid var(--border-strong);border-radius:10px;
    background:var(--surface-2);color:var(--text);transition:.12s
  }
  .field input:focus,.field textarea:focus,.field select:focus{
    outline:none;border-color:var(--primary);background:var(--surface)
  }
  .field textarea{resize:vertical;min-height:74px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .multi{display:flex;flex-wrap:wrap;gap:7px}
  .mchip{
    appearance:none;border:1.5px solid var(--border-strong);background:var(--surface-2);color:var(--text-dim);
    padding:6px 11px;border-radius:20px;font-size:13px;font-weight:600;transition:.12s
  }
  .mchip:hover{border-color:var(--primary);color:var(--primary)}
  .mchip.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .multi-empty{font-size:13px;color:var(--text-faint);padding:6px 2px}
  .link-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
  .tag.sch{background:var(--primary-soft);color:var(--primary-ink)}
  .tag.loc{background:var(--accent-soft);color:var(--accent)}
  .linkline{display:flex;align-items:center;gap:6px;margin-top:11px;font-size:12.5px;color:var(--text-dim)}
  .linkline .ll-ico{display:flex;color:var(--primary)}
  .linkline .ll-ico svg{width:14px;height:14px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media (max-width:440px){.row3{grid-template-columns:1fr 1fr}}
  .hint{font-size:12px;color:var(--text-dim);background:var(--surface-2);border-radius:9px;padding:9px 11px;line-height:1.5;margin-top:2px}
  .due{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:650;padding:3px 9px;border-radius:20px;line-height:1.4}
  .due svg{width:12px;height:12px}

<!--

  cos 安排板 · 独立版（Firebase）
  这是一个可脱离 Claude、独立部署的版本。数据、图片、登录与权限都走 Firebase。
  一次性配置（约 8 分钟）：
   1. 打开 https://console.firebase.google.com 新建一个项目
   2. 构建(Build) → Firestore Database → 创建数据库（生产模式即可）
   3. 构建(Build) → Authentication → 登录方法 → 启用「Google」
   4. 项目设置 → 你的应用 → 注册一个「Web 应用」，把生成的 firebaseConfig
      粘贴到下面 firebaseConfig（替换所有 TODO）
   5. 把「Firestore 安全规则」（见随附说明）粘贴到 Firestore 规则并发布
   6. Authentication → Settings → 授权域名，加入你部署的域名（本地调试加 localhost）
   7. 把本文件传到任意静态托管（GitHub Pages / Netlify / Firebase Hosting 均可），
      手机浏览器打开即用。把网址发给同伴 = 邀请协作。
  说明：本版本不使用 Firebase Storage，图片会在本地压缩后存进 Firestore，
        因此无需升级 Blaze、无需绑定信用卡，全程在免费的 Spark 计划内。
  首个登录者自动成为「拥有者」，其余人默认「仅查看」，拥有者可在右上角头像里
  的「成员」把某人改成「可编辑」。

<script>
"use strict";

/* image storage (free / no Firebase Storage): compressed images live in the
   Firestore "blobs" collection; imgURL resolves an id to its cached data URL. */
let blobCache = {};
const TRANSPARENT_PX = "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
function imgURL(id){
  if(!id) return TRANSPARENT_PX;
  if(/^https?:|^data:/.test(id)) return id;
  return blobCache[id] || TRANSPARENT_PX;
}

/* ---------- tiny DOM helper (user text always via textContent) ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    const v = attrs[k];
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=v;
    else if(k==="html") n.innerHTML=v;               // trusted icon markup only
    else if(k[0]==="o"&&k[1]==="n") n.addEventListener(k.slice(2).toLowerCase(), v);
    else n.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c==null||c===false) continue; n.append(c.nodeType?c:document.createTextNode(String(c))); }
  return n;
}
const $ = s => document.querySelector(s);

/* ---------- icons (trusted) ---------- */
const I = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  img:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L5 21"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',

  mask:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5s2-1 9-1 9 1 9 1v6c0 5-4 9-9 9s-9-4-9-9V5Z"/><path d="M8 10h.01M16 10h.01M9 15c1 1 5 1 6 0"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>',
  chevL:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  chevR:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>',
  flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V4s-1 1-4 1-5-2-8-2-4 1-4 1z"/><path d="M4 22V4"/></svg>',
};

/* ---------- state ---------- */
let db=null, assets=null, user=null;
let myId=null, canWrite=null, dbReady=false;
const store = { characters:{}, locations:{}, photography:{}, schedule:{}, todos:{} };
let active = "characters";

const TABS = [
  {id:"characters", label:"角色",   icon:I.mask},
  {id:"locations",  label:"地点",   icon:I.pin},
  {id:"photography",label:"摄影",   icon:I.cam},
  {id:"schedule",   label:"时间表", icon:I.cal},
  {id:"todos",      label:"待办",   icon:I.check},
];

/* preparation status options (tone: todo=灰 doing=橙 done=绿) */
const STATUS = {
  wig: [
    {v:"未购买", tone:"todo"},
    {v:"已下单", tone:"doing"},
    {v:"已到货", tone:"doing"},
    {v:"待造型", tone:"doing"},
    {v:"已造型", tone:"done"},
  ],
  costume: [
    {v:"未准备", tone:"todo"},
    {v:"制作中", tone:"doing"},
    {v:"采购中", tone:"doing"},
    {v:"已完成", tone:"done"},
  ],
  prop: [
    {v:"未准备", tone:"todo"},
    {v:"制作中", tone:"doing"},
    {v:"采购中", tone:"doing"},
    {v:"已完成", tone:"done"},
  ],
  todo: [
    {v:"未开始", tone:"todo"},
    {v:"进行中", tone:"doing"},
    {v:"已完成", tone:"done"},
  ],
  equip: [
    {v:"未确定", tone:"todo"},
    {v:"协调中", tone:"doing"},
    {v:"已就位", tone:"done"},
  ],
  filter: [
    {v:"未确定", tone:"todo"},
    {v:"测试中", tone:"doing"},
    {v:"已确定", tone:"done"},
  ],
};
/* character preparation tracks a todo can link to (key -> label + doc field) */
const TRACKS = {
  wig:     {label:"假发", field:"wig"},
  costume: {label:"服装", field:"costumeStatus"},
  prop:    {label:"道具", field:"prop"},
};
function statusTone(setKey,val){ const o=(STATUS[setKey]||[]).find(x=>x.v===val); return o?o.tone:"todo"; }
function statusSelect(setKey,val){
  const s=el("select",{});
  s.append(el("option",{value:"",text:"未设置"}));
  STATUS[setKey].forEach(o=>{ const op=el("option",{value:o.v,text:o.v}); if(o.v===val) op.selected=true; s.append(op); });
  return s;
}
function statChip(label,setKey,val){
  return el("span",{class:"stat "+statusTone(setKey,val)}, el("span",{class:"stat-k",text:label}), el("span",{text:val}));
}
/* the "completed" value of a track (last done-toned option) */
function trackDoneValue(track){
  const arr=STATUS[track]||[];
  for(let i=arr.length-1;i>=0;i--) if(arr[i].tone==="done") return arr[i].v;
  return arr.length?arr[arr.length-1].v:"";
}
/* interactive status chip: click cycles through STATUS[statusKey] and writes to db */
function clickStatChip(col, docId, field, statusKey, label, val){
  val=val||"";
  const chip=el("span",{class:"stat click "+statusTone(statusKey,val)+(val?"":" unset")},
    el("span",{class:"stat-k",text:label}),
    el("span",{text: val||"未设置"})
  );
  chip.title="点击切换"+label;
  chip.addEventListener("click",async(e)=>{
    e.stopPropagation();
    const opts=["",...STATUS[statusKey].map(o=>o.v)];
    const next=opts[(opts.indexOf(val)+1)%opts.length];
    chip.style.opacity=".45";
    try{ await db.collection(col).doc(docId).update({[field]:next}); }
    catch(err){ alert("保存失败："+(err.code||err)); chip.style.opacity=""; }
  });
  return chip;
}
/* a row of status chips: clickable for editors, static (set-only) for viewers */
function statusRow(col, docId, specs){
  if(editable()) return el("div",{class:"status-row"}, specs.map(s=>clickStatChip(col,docId,s.field,s.key,s.label,s.val)));
  const set=specs.filter(s=>s.val);
  return set.length?el("div",{class:"status-row"}, set.map(s=>statChip(s.label,s.key,s.val))):null;
}

/* ================= Firebase backend (standalone) ================= */

const firebaseConfig = {

/* 一个部署可承载多个板：网址后加 ?b=板名 即为不同的板；默认 main */

function bootFirebase(){
  if(!firebaseConfig || firebaseConfig.apiKey==="TODO"){ showConfigGate(); return; }
  firebase.initializeApp(firebaseConfig);
  fauth=firebase.auth(); fdb=firebase.firestore();

    subscribeMembers();

  });
}

/* compress an image file to a JPEG data URL small enough for a Firestore doc */
function compressImage(file, maxDim, quality){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>{
      URL.revokeObjectURL(url);
      let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
      const scale=Math.min(1, maxDim/Math.max(w,h));
      w=Math.max(1,Math.round(w*scale)); h=Math.max(1,Math.round(h*scale));
      const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
      const ctx=cv.getContext("2d");
      ctx.fillStyle="#ffffff"; ctx.fillRect(0,0,w,h);      // flatten transparency
      ctx.drawImage(img,0,0,w,h);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("图片读取失败")); };
    img.src=url;
  });
}
async function fileToStoredDataURL(file){
  const tries=[[1280,0.72],[1024,0.68],[820,0.62],[640,0.56]];
  let out=null;
  for(const [dim,q] of tries){
    out=await compressImage(file, dim, q);
    if(out.length < 920000) return out;   // keep under Firestore's 1MB doc limit
  }
  return out;
}
function buildShims(){
  const col = (name)=> fdb.collection("boards/"+BOARD_ID+"/"+name);
  db = {
    collection(name){
      return {
        onSnapshot(next, err){
          return col(name).onSnapshot(
            s=> next({ docs: s.docs.map(d=>({ id:d.id, data:()=>d.data() })) }),
            e=> err && err({ code: e.code || "error" })
          );
        },
        doc(id){
          const ref = id ? col(name).doc(id) : col(name).doc();
          return {
            id: ref.id,
            set:(o)=>ref.set(o),
            update:(o)=>ref.update(o),
            delete:()=>ref.delete(),
          };
        },
        add(o){ return col(name).add(o); },
      };
    }
  };
  assets = {
    async upload(file){
      if(!file || !file.type || !file.type.startsWith("image/")) throw {code:"not-an-image"};
      const dataURL = await fileToStoredDataURL(file);
      const ref = await fdb.collection("boards/"+BOARD_ID+"/blobs").add({ data:dataURL, createdAt:Date.now() });
      blobCache[ref.id] = dataURL;      // cache locally so the thumbnail shows immediately
      return { id: ref.id };
    }
  };
  user = {
    async id(){ return myId; },
    async can(){ return editable(); },
    async profiles(ids){
      const out={};
      (ids||[]).forEach(id=>{ const m=membersCache[id]; if(m) out[id]={ name:m.name||"", avatarUrl:m.photo||"" }; });
      return out;
    }
  };
}

async function ensureMembership(u){
  const boardRef = fdb.doc("boards/"+BOARD_ID);
  const memRef   = fdb.doc("boards/"+BOARD_ID+"/members/"+u.uid);
  const board = await boardRef.get();
  const prof = { name:u.displayName||"用户", photo:u.photoURL||"", email:u.email||"" };
  if(!board.exists){
    await boardRef.set({ ownerUid:u.uid, createdAt:Date.now() });
    await memRef.set({ role:"owner", joinedAt:Date.now(), ...prof });
  }else{
    const mem = await memRef.get();

function subscribeData(){

  ["characters","locations","photography","schedule","todos"].forEach(c=>{

      snap=>{ store[c]={}; snap.docs.forEach(d=>{ store[c][d.id]=d.data(); }); dbReady=true; render(); renderContrib(); },
      err=>{ console.warn("db",c,err.code); dbReady=true; render(); }
    );

/* ============ SCHEDULE (calendar + list) ============ */
const WD=["周日","周一","周二","周三","周四","周五","周六"];
const WD_MIN=["日","一","二","三","四","五","六"];
let schView="cal";
let calCursor=null; // Date at day 1 of displayed month
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function parseYMD(s){ const d=new Date(s+"T00:00:00"); return isNaN(d)?null:d; }
function fmtDay(s){
  if(!s) return {label:"未定日期", wd:""};
  const dt=parseYMD(s); if(!dt) return {label:s, wd:""};
  return {label:(dt.getMonth()+1)+" 月 "+dt.getDate()+" 日", wd:WD[dt.getDay()]};
}
function eventsByDate(){
  const map={};
  entries("schedule").forEach(s=>{ if(s.date){ (map[s.date]=map[s.date]||[]).push({type:"sch",s}); } });
  entries("todos").forEach(t=>{ if(t.due){ (map[t.due]=map[t.due]||[]).push({type:"todo",t}); } });
  Object.values(map).forEach(arr=>arr.sort((a,b)=>{
    const at=a.type==="sch"?(a.s.time||"00:00"):"99:99";
    const bt=b.type==="sch"?(b.s.time||"00:00"):"99:99";
    return at.localeCompare(bt);
  }));
  return map;
}

  else await renderScheduleList(v);

function renderScheduleCal(v){
  const now=new Date();
  if(!calCursor) calCursor=new Date(now.getFullYear(), now.getMonth(), 1);
  const year=calCursor.getFullYear(), month=calCursor.getMonth();
  const startDow=new Date(year,month,1).getDay();
  const daysInMonth=new Date(year,month+1,0).getDate();
  const map=eventsByDate();
  const todayStr=ymd(now);

  const nav=el("div",{class:"cal-nav"},

/* ============ TODOS ============ */
function todoStatus(t){ return t.status || (t.done?"已完成":"未开始"); }
function todoDone(t){ return todoStatus(t)==="已完成"; }
function dueInfo(due, done){
  if(!due) return null;
  const d=new Date(due+"T00:00:00"); if(isNaN(d)) return null;
  const today=new Date(); today.setHours(0,0,0,0);
  const diff=Math.round((d-today)/86400000);
  if(done) return {label:(d.getMonth()+1)+"月"+d.getDate()+"日", tone:"done"};
  if(diff<0)  return {label:"已逾期 "+(-diff)+" 天", tone:"over"};
  if(diff===0) return {label:"今天截止", tone:"soon"};
  if(diff===1) return {label:"明天截止", tone:"soon"};
  if(diff<=3)  return {label:"剩 "+diff+" 天", tone:"soon"};
  return {label:(d.getMonth()+1)+"月"+d.getDate()+"日", tone:"norm"};
}
async function renderTodos(v){
  v.append(sectionHead("待办", "状态 · 截止日期 · 关联角色与准备状态", ()=>openTodoModal()));
  const list=entries("todos");
  if(!list.length){ v.append(emptyState(I.check,"还没有待办","列出要买的、要做的、要确认的事项。",()=>openTodoModal(),"添加待办")); return; }
  list.sort((a,b)=>{
    const ad=todoDone(a), bd=todoDone(b);
    if(ad!==bd) return ad?1:-1;
    const au=a.due||"9999-99-99", bu=b.due||"9999-99-99";
    if(au!==bu) return au<bu?-1:1;
    return sortByCreated(a,b);
  });
  const p=await profs(list.map(c=>c.createdBy));
  const wrap=el("div",{class:"list"});
  list.forEach(t=>{
    const done=todoDone(t), st=todoStatus(t);
    const chk=el("input",{type:"checkbox",class:"check"});
    chk.checked=done;
    if(editable()) chk.addEventListener("change",()=>toggleTodo(t,chk.checked));
    else chk.disabled=true;
    const rel = t.charId && store.characters[t.charId];
    const tr = t.track && TRACKS[t.track];
    const trVal = rel && tr ? rel[tr.field] : "";
    const di = dueInfo(t.due, done);
    wrap.append(el("div",{class:"card todo"+(done?" done":"")},
      chk,
      el("div",{class:"tbody"},
        el("div",{class:"ttext",text:t.text||""}),
        el("div",{class:"tmeta"},
          el("span",{class:"stat "+statusTone("todo",st)}, el("span",{text:st})),
          di&&el("span",{class:"due "+di.tone}, el("span",{html:I.clock}), el("span",{text:di.label})),
          rel&&el("span",{class:"tag char"}, el("span",{html:I.mask}),
            el("span",{text: rel.name||"角色"}), tr&&el("span",{text:" · "+tr.label})),
          rel&&tr&&el("span",{class:"stat "+statusTone(t.track, trVal)}, el("span",{class:"stat-k",text:tr.label}), el("span",{text: trVal||"未设置"})),
          t.who&&el("span",{class:"tag who"}, el("span",{html:I.user}), el("span",{text:t.who}))
        ),
        foot(t,p,()=>openTodoModal(t))
      )
    ));
  });
  v.append(wrap);
}
async function syncTrack(charId, track){
  if(!charId || !track || !TRACKS[track]) return;
  const dv=trackDoneValue(track); if(!dv) return;
  try{ await db.collection("characters").doc(charId).update({[TRACKS[track].field]: dv}); }catch(e){}
}
async function toggleTodo(t, checked){
  const status = checked ? "已完成" : "进行中";
  try{
    await db.collection("todos").doc(t.id).update({done:checked, status});
    if(checked) await syncTrack(t.charId, t.track);
  }
  catch(e){ alert("保存失败："+(e.code||e)); }
}

/* reusable image uploader: manages its own asset-id list */
function makeUploader(initial, opts){
  opts=opts||{};
  let ids = Array.isArray(initial)?[...initial]:[];
  const gallery=el("div",{class:"uploader"+(opts.small?" sm":"")});
  const fileInput=el("input",{type:"file",accept:"image/*",multiple:true,class:"sr"});
  fileInput.addEventListener("change",()=>ingest(fileInput.files));
  async function ingest(files){
    if(!assets){ alert("当前无法上传图片。"); return; }
    for(const f of files){
      if(!f.type.startsWith("image/")) continue;
      const t=el("div",{class:"thumb load"}, el("span",{class:"spin"}));
      gallery.insertBefore(t, gallery.querySelector(".add-img"));
      try{ const r=await assets.upload(f); ids.push(r.id); }
      catch(e){ alert("图片上传失败："+(e.code||e)); }
      t.remove(); draw();
    }
    fileInput.value="";
  }
  function draw(){
    gallery.innerHTML="";
    ids.forEach(id=>{
      const t=el("div",{class:"thumb"});
      const im=el("img",{alt:""}); im.src=imgURL(id); t.append(im);
      t.append(el("button",{class:"rm",html:I.x,onClick:()=>{ ids=ids.filter(x=>x!==id); draw(); }}));
      gallery.append(t);
    });
    if(assets) gallery.append(el("button",{class:"add-img",onClick:()=>fileInput.click()}, el("span",{html:I.plus}), opts.label||"上传"));
    gallery.append(fileInput);
  }
  draw();
  return { el:gallery, getIds:()=>ids };
}

/* scenes manager: a growable list, each scene = text + its own reference images */
function makeScenes(initial){
  let scenes = (Array.isArray(initial)?initial:[]).map(s=>({ text:s.text||"", up:makeUploader(s.images, {small:true, label:"参考图"}) }));
  const wrap=el("div",{class:"scenes"});
  function add(){ scenes.push({ text:"", up:makeUploader([], {small:true, label:"参考图"}) }); draw(); }
  function draw(){
    wrap.innerHTML="";
    scenes.forEach((sc,i)=>{
      const ta=el("textarea",{placeholder:"场景描述，如：教室日常 / 雨中场景 / 战斗…"}); ta.value=sc.text;
      ta.addEventListener("input",()=>{ sc.text=ta.value; });
      wrap.append(el("div",{class:"scene-card"},
        el("div",{class:"scene-top"},
          el("span",{class:"scene-idx",text:"场景 "+(i+1)}),
          el("button",{class:"icon-btn",title:"删除场景",html:I.trash,onClick:()=>{ scenes.splice(i,1); draw(); }})
        ),
        ta, sc.up.el
      ));
    });
    wrap.append(el("button",{class:"btn sm add-scene",onClick:add}, el("span",{html:I.plus}), "添加场景"));
  }
  draw();
  return { el:wrap, getScenes:()=> scenes.map(sc=>({text:sc.text.trim(), images:sc.up.getIds()})).filter(sc=>sc.text||sc.images.length) };
}

function openModal(title, bodyNode, onSave, onDelete){
  const modal=$("#modal");
  modal.innerHTML="";
  modal.append(
    el("div",{class:"modal-head"},
      el("h2",{text:title}),
      el("button",{class:"icon-btn",html:I.x,onClick:closeModal})
    ),
    el("div",{class:"modal-body"}, bodyNode)
  );
  const foot=el("div",{class:"modal-foot"});
  if(onDelete) foot.append(el("button",{class:"btn danger ghost",onClick:async()=>{ if(confirm("确定删除？此操作不可撤销。")){ await onDelete(); closeModal(); }},html:I.trash+'<span style="margin-left:2px">删除</span>'}));
  foot.append(el("span",{class:"grow"}));
  foot.append(el("button",{class:"btn",text:"取消",onClick:closeModal}));
  const saveBtn=el("button",{class:"btn primary",text:"保存"});
  saveBtn.addEventListener("click",async()=>{
    saveBtn.disabled=true; saveBtn.textContent="保存中…";
    try{ const ok=await onSave(); if(ok!==false) closeModal(); }
    catch(e){ alert("保存失败："+(e.code||e.message||e)); }
    finally{ saveBtn.disabled=false; saveBtn.textContent="保存"; }
  });
  foot.append(saveBtn);
  modal.append(foot);
  $("#overlay").classList.add("open");
  const first=modal.querySelector("input,textarea,select"); if(first) setTimeout(()=>first.focus(),120);
}

/* toggle-chip multi-select; items: [{id,label}] */
function makeMultiChips(items, selected){
  const sel=new Set(selected||[]);
  const wrap=el("div",{class:"multi"});
  if(!items.length){ wrap.append(el("div",{class:"multi-empty",text:"暂无可选项"})); return { el:wrap, getIds:()=>[] }; }
  items.forEach(it=>{
    const chip=el("button",{type:"button",class:"mchip"+(sel.has(it.id)?" on":"")}, it.label);
    chip.addEventListener("click",()=>{ if(sel.has(it.id)) sel.delete(it.id); else sel.add(it.id); chip.classList.toggle("on"); });
    wrap.append(chip);
  });
  return { el:wrap, getIds:()=>items.filter(it=>sel.has(it.id)).map(it=>it.id) };
}

    async()=>{
      if(!title.value.trim()){ title.focus(); return false; }
      const data={ title:title.value.trim(), date:date.value, time:time.value, locationId:loc.value, who:who.value.trim(), note:note.value.trim() };
      if(s) await db.collection("schedule").doc(s.id).update(data);
      else await db.collection("schedule").add({...data, ...baseMeta()});
    },
    s?async()=>{ await db.collection("schedule").doc(s.id).delete(); }:null
  );
}

/* --- todo modal --- */
function trackSelect(val){
  const s=el("select",{});
  s.append(el("option",{value:"",text:"— 不关联 —"}));
  Object.keys(TRACKS).forEach(k=>{ const op=el("option",{value:k,text:TRACKS[k].label+"状态"}); if(k===val) op.selected=true; s.append(op); });
  return s;
}
function openTodoModal(t){
  t=t||null;
  const text=input(t&&t.text,"要做的事…");
  const status=statusSelect("todo", t?todoStatus(t):"未开始");
  const due=input(t&&t.due,"","date");
  const who=input(t&&t.who,"负责人");
  const ch=selectFrom("characters", t&&t.charId, "— 关联角色（可选）—");
  const track=trackSelect(t&&t.track);
  const body=el("div",{},
    field("待办内容", text, true),
    el("div",{class:"row2"}, field("状态", status), field("截止日期", due)),
    field("负责人", who),
    el("div",{class:"row2"}, field("关联角色", ch), field("关联准备项", track)),
    el("div",{class:"hint",text:"勾选完成或将状态设为「已完成」时，会自动把所关联角色的对应准备项标记为完成。"}),
  );
  openModal(t?"编辑待办":"添加待办", body,
    async()=>{
      if(!text.value.trim()){ text.focus(); return false; }
      const st=status.value||"未开始";
      const done=st==="已完成";
      const data={ text:text.value.trim(), status:st, done, due:due.value, who:who.value.trim(), charId:ch.value, track:track.value };
      if(t) await db.collection("todos").doc(t.id).update(data);
      else await db.collection("todos").add({...data, ...baseMeta()});
      if(done && data.charId && data.track) await syncTrack(data.charId, data.track);
    },
    t?async()=>{ await db.collection("todos").doc(t.id).delete(); }:null
  );
}

/* ---------- lightbox ---------- */
function lightbox(src){
  const lb=$("#lightbox"); lb.querySelector("img").src=src; lb.classList.add("open");
}
$("#lightbox").addEventListener("click",()=>$("#lightbox").classList.remove("open"));
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeModal(); $("#lightbox").classList.remove("open"); }});
</script>
